name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      # numba is a pure accelerator here; the docs say so, so prove it.
      - name: Test without the JIT
        env:
          NUMBA_DISABLE_JIT: "1"
        run: pytest -q

      - name: Upload coverage
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check connectx agents tests recipes scripts

      - name: Ruff (format)
        run: ruff format --check connectx agents tests recipes scripts

      - name: Mypy
        run: mypy

  smoke:
    name: cli smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[rl]"

      # Every command documented in USAGE.md must survive a clean checkout.
      - name: Run the documented commands
        run: |
          connectx agents
          connectx play --preset tiny --agents random random --quiet
          connectx match --preset tiny --agents greedy random --games 20
          connectx tournament --preset tiny --agents random greedy --games 10
          connectx sweep --agents greedy random --shapes 4x5 5x6 --ks 3 --games 10 --quiet
          connectx surface --agents random greedy --shapes 4x5 --ks 3 --games 10 --quiet
          connectx bench --preset tiny --quick
          python scripts/ablation.py macro --json /tmp/ablation.json
          python main.py play --preset tiny --agents random random --quiet
          python recipes/class_example.py
          python recipes/functional_example.py
          python recipes/selfplay_example.py
          python scripts/experiment.py experiments/smoke.json --out /tmp/smoke.jsonl
